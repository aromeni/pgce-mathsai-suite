# Render Blueprint for MathsAI.
#
# Paths are written from the repository root because that is where Render
# reads this file; the application itself lives one level down in mathsai/.
#
# To deploy: push this repo, then in Render choose "New > Blueprint" and
# point it at the repository. The three `sync: false` variables below are
# deliberately NOT in this file and must be set in Render's dashboard — see
# mathsai/README.md → Running online.
services:
  - type: web
    name: mathsai
    runtime: docker
    # Disks require a paid instance type; the free tier cannot mount one,
    # and without a disk every generated lesson is destroyed on redeploy.
    plan: starter
    # Closest region to the UK, which also keeps the teaching log inside
    # the EU rather than shipping it to a US region.
    region: frankfurt
    dockerfilePath: ./mathsai/Dockerfile
    dockerContext: ./mathsai
    healthCheckPath: /api/health

    # The SQLite file is the only copy of every generated lesson, question
    # set, and teaching log entry. Mounted at the path DATABASE_URL points
    # to, so it survives redeploys and restarts.
    disk:
      name: mathsai-data
      mountPath: /app/data
      sizeGB: 1

    envVars:
      # Switches on the fail-closed auth check in backend/auth.py and makes
      # the session cookie HTTPS-only. Do not set this to anything else.
      - key: ENVIRONMENT
        value: production

      # Four slashes: sqlite:/// + the absolute path /app/data/mathsai.db.
      - key: DATABASE_URL
        value: sqlite:////app/data/mathsai.db

      # Set in the Render dashboard, never committed.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Produced by `python generate_password_hash.py` — the hash, never the
      # password itself.
      - key: APP_PASSWORD_HASH
        sync: false

      # Render generates this once and keeps it stable across deploys.
      # Changing it invalidates every existing session cookie, which simply
      # means signing in again.
      - key: SECRET_KEY
        generateValue: true
