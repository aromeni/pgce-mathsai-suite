services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Persists the SQLite file across container recreation/redeploy — the
      # .db file is the only copy of everything generated and taught
      # (CLAUDE.md Production Hardening — Database migrations and backups),
      # so it must live on a mounted volume, not ephemeral container storage.
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/mathsai.db
    restart: unless-stopped
