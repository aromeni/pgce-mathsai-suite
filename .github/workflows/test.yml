name: Backend tests

on:
  push:
    paths:
      - "mathsai/backend/**"
      - "mathsai/frontend/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "mathsai/backend/**"
      - "mathsai/frontend/**"
      - ".github/workflows/test.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mathsai/backend
    env:
      # Dummy value — the Anthropic client is always mocked in tests, so no
      # real key or API cost is ever needed to run this suite.
      ANTHROPIC_API_KEY: test-key-not-used
      DATABASE_URL: sqlite:///./ci_test.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install WeasyPrint native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libcairo2 libgdk-pixbuf-2.0-0 libffi8 shared-mime-info fonts-liberation

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest

  render:
    # Executes the lesson components against a real API payload. A Vite build
    # succeeding proves only that the syntax is valid — a dangling variable
    # reference compiles cleanly and throws at runtime, which is how a blank
    # Lesson page once reached production.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mathsai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm run test:render
